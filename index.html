<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UEH Learning</title>
  <meta name="description" content="UEH University learning management and academic operations platform.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2303606a'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='800' font-size='12' fill='white' text-anchor='middle'%3EUEH%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    try {
      const s = JSON.parse(localStorage.getItem('UEH_LMS_STATE_V7') || '{}');
      const t = s.ui && s.ui.theme;
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
    } catch (e) {}
  </script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app">
    <div style="padding:40px;display:flex;flex-direction:column;gap:12px;max-width:480px">
      <div class="skeleton" style="width:40%"></div><div class="skeleton"></div><div class="skeleton" style="width:70%"></div>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <div class="lang-switch" role="group" aria-label="Language" data-no-i18n><button data-action="set-lang" data-lang="vi" class="active">VN</button><button data-action="set-lang" data-lang="en">EN</button></div>
  <noscript>UEH Learning requires JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
